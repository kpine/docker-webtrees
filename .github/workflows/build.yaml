name: Build and Release Images

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release image
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Run formatter
        run: nix fmt -- --ci --verbose

      - name: Build image
        run: |
          nix build .#docker
          ./result | docker load
          echo "IMAGE=$(nix eval --raw .#docker.imageName)" >> "$GITHUB_ENV"
          echo "VERSION=$(nix eval --raw .#docker.imageTag)" >> "$GITHUB_ENV"

      - name: Push image
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Push PR image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:$PR_TAG"
          docker push "$IMAGE:$PR_TAG"
